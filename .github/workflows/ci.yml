name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0
      - name: Compile
        run: python3 -m py_compile steam_trainer_launcher.py protontrek_core.py protonhook_tools.py gtk_ui.py main.py
      - name: Import and smoke test
        run: |
          python3 steam_trainer_launcher.py --version
          python3 - <<'EOF'
          import protonhook_tools as t
          from pathlib import Path
          # PE parsing must not crash on non-PE input.
          assert t.read_exe_info(Path("README.md")) is None
          import gtk_ui  # GTK 3 bindings resolve
          print("ok")
          EOF
