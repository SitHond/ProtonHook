name: Release

# Push a tag like v0.2.0 to build and publish a GitHub release.
# "Run workflow" (manual) builds the same files as downloadable artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-binary:
    name: Linux binary
    # Oldest supported runner: the binary links against its glibc, so building
    # here keeps it working on older distros as well as on new ones.
    runs-on: ubuntu-22.04
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install GTK 3 and PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 adwaita-icon-theme-full

      - name: Install PyInstaller
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "pyinstaller==6.22.3"

      - name: Build
        run: PYINSTALLER=.venv/bin/pyinstaller packaging/build.sh "${{ steps.version.outputs.value }}"

      - name: Smoke test
        run: |
          ./dist-release/protonhook --version
          python3 dist-release/protonhook.pyz --version

      - uses: actions/upload-artifact@v4
        with:
          name: protonhook-linux
          path: dist-release/*
          if-no-files-found: error

  decky-plugin:
    name: Decky Loader plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Package
        run: |
          mkdir -p out/ProtonHook/dist
          cp plugin.json package.json main.py protontrek_core.py LICENSE out/ProtonHook/
          cp dist/index.js out/ProtonHook/dist/
          (cd out && zip -r ProtonHook-decky.zip ProtonHook)
      - uses: actions/upload-artifact@v4
        with:
          name: protonhook-decky
          path: out/ProtonHook-decky.zip
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [linux-binary, decky-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/protonhook
            artifacts/protonhook.pyz
            artifacts/SHA256SUMS
            artifacts/ProtonHook-decky.zip
